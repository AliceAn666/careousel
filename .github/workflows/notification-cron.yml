name: Careousel notification scheduler

# Temporarily paused during hackathon development to conserve Actions minutes.
# To resume: restore the previous schedule ("13,43 * * * *") under "on:".
# Manual workflow_dispatch remains available for controlled tests.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: careousel-notification-scheduler
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Process due notification groups
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsS --retry 2 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=careousel-notification-cron-v1" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')"
          response="$(curl -fsS --retry 3 --retry-delay 3 --max-time 55 \
            -X POST -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/json" \
            "https://careousel-anyanran9999-7448.vercel.app/api/internal/notifications/github")"
          printf '%s' "$response" | python3 -c 'import json,sys; result=json.load(sys.stdin); assert result.get("ok") is True, "Notification endpoint did not confirm success"'
