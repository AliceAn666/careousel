name: Careousel checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: careousel
          POSTGRES_PASSWORD: careousel_demo
          POSTGRES_DB: careousel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careousel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://careousel:careousel_demo@localhost:5432/careousel
      TEST_DATABASE_URL: postgresql://careousel:careousel_demo@localhost:5432/careousel_test
      DEMO_MODE: "true"
      SESSION_SECRET: ci-only-synthetic-session-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:test:prepare
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run test:persistence
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
