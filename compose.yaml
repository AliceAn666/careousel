services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careousel
      POSTGRES_PASSWORD: careousel_demo
      POSTGRES_DB: careousel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - careousel_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careousel"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  careousel_data:
